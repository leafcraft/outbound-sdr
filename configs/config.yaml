# outbound-sdr — Outbound-SDR Pod
#
# A pod of digital employees + human members that runs a go-to-market
# motion end to end: research a GTM strategy -> build sellable offerings ->
# a coordinator opens a campaign case -> assemble the campaign -> a human
# approves the spend/brand -> source leads -> hyper-personalise a multi-step
# sequence -> LAUNCH (the finisher, behind the send gate) -> pull replies ->
# triage -> a human works the reply to a booked meeting -> CRM record.
#
# The pod is a TEAM, not a pipeline. Every wire is conditional; every
# hand-off is a finished contract; nothing is sourced, sent or approved on
# silence; the LAUNCHER is the finisher — it re-checks approval, enforces
# invariants a human can't waive, renders the real launch pack, and fails
# closed (delete-on-block). The WORM sink is the terminus. Systems (Apollo /
# EmailBison / mailbox / calendar / CRM) are TOOLS inside agents, never members.
#
# Design doctrine: .claude/skills/leafmesh/building-agents-thoroughly.md
# Field reference:  .claude/skills/leafmesh/agent-config-fields.md
# Full design:      PRD.md

name: "outbound-sdr"
version: "1.0.0"
architecture: "managed_mesh"
environment: "development"
debug: true
log_level: "INFO"

auto_discover:
  directory: "./agency"
  pattern: "*_agent.py"
  recursive: false

# The Manager is the SUPERVISOR — it escalates to the Growth/RevOps Lead (the
# accountable owner) when an agent hits an error a retry cannot fix (auth, bad
# request, credit, bad config), when 5 different agents fail in one session, or
# when restarts run out. A contract violation raises an alert, not an
# escalation. It does not chase an unanswered approval. The two real stall
# routes are WIRES, not Manager rules: an incomplete sequence batch after its
# retry budget, and a blocked launch, both go to the Growth/RevOps Lead.
manager:
  model: "gpt-4o-mini"
  domain: "generic"
  can_intervene: true
  prompt: |
    Outbound SDR operation. The motion:
      - gtm_strategist_agent researches the onboarded company and owns the
        GTM doc; weekly it appends ideas/events or spins a new GTM on a
        strategy shift, and promotes offering-worthy ideas to the offering builder
      - offer_architect_agent turns ideas into offerings with A/B × persona
        × industry variants
      - sdr_coordinator_agent opens a campaign case and orchestrates it,
        keeping live status; it never sources, writes, or sends
      - campaign_strategist_agent assembles the campaign; a human approves
        spend + brand before anything sends
      - prospector_agent sources leads; outreach_writer_agent writes
        hyper-personalised multi-step sequences (fan-out across parallel copies,
        each claiming a disjoint batch)
      - campaign_launcher_agent is the FINISHER — it re-checks approval and
        launches only a complete, approved campaign; it fails closed
      - replies are pulled, triaged, and worked by a human to a meeting
    Escalate to the Growth/RevOps Lead when an agent fails in a way a retry
    will not fix, or keeps failing. Enrichment stalls and blocked launches
    already reach the Growth/RevOps Lead through their own wires. An approval
    nobody answers is not escalated: the request waits its time and stops,
    and nothing is sourced or sent on silence.
  routing:
    mode: "static"                # regulated send path — deterministic routing
  escalation:
    targets:
      - type: "human_agent"
        agent: "growth_lead_human"
    auto_escalate:
      max_retries: 3
      max_errors_per_session: 5

# 2.4.131 runtime block — research + enrichment run long; the 2.4.131 default
# llm hard timeout dropped to 90s, so raise it here. (The `timeouts` block is
# rejected by <=2.4.130 — it must land WITH the 2.4.131 floor.)
timeouts:
  mesh_call_default_timeout_s: 300               # research + enrichment are long-running
  llm_hard_timeout_s: 300

# ─────────────────────────────────────────────────────────────────────
# DATA STRUCTURES (see PRD §3 for full shapes)
# ─────────────────────────────────────────────────────────────────────
data_structures:
  CompanyOnboarding:
    type: "object"
    properties:
      company_name: { type: "string" }
      website:      { type: "string" }
      linkedin:     { type: "string" }
      extra:        { type: "object" }
    required: ["company_name"]

# ─────────────────────────────────────────────────────────────────────
# ENTRY POINTS — one per real-world trigger, plus direct-call debug doors
# ─────────────────────────────────────────────────────────────────────
entry_points:
  - name: "onboard_company"
    target: "gtm_strategist_agent"
    description: "A company is onboarded (name, website, linkedin, …) — research the GTM."
    condition: always
  - name: "weekly_gtm_sweep"
    target: "gtm_strategist_agent"
    description: "Mon 07:00 (local) cron — find market events/ideas, append or spin a new GTM."
    condition: always
  - name: "weekly_offering_sweep"
    target: "offer_architect_agent"
    description: "Mon 08:00 (local) cron — build offerings for ideas that lack one."
    condition: always
  - name: "start_campaign"
    target: "sdr_coordinator_agent"
    description: "Growth team asks to run a campaign for a GTM + offering — the coordinator opens the case."
    condition: always
  - name: "campaign_status"
    target: "sdr_coordinator_agent"
    description: "Anyone asks 'where is my campaign?' — the coordinator answers from the record."
    condition: always
  - name: "pull_replies"
    target: "inbox_monitor_agent"
    description: "Every 15 min (local) — pull new replies from the mailbox/sequencer."
    condition: always
  - name: "sdr_reply"
    target: "sdr_human"
    description: "HITL resume — an SDR works a flagged reply (book / send / hold)."
    condition: always
  # ── Direct-call doors (debug / replay / programmatic) ──
  - name: "direct_call_campaign"
    target: "campaign_strategist_agent"
    description: "Assemble one campaign directly."
    condition: always
  - name: "direct_call_prospector"
    target: "prospector_agent"
    description: "Pull a lead list directly (Apollo / dev store)."
    condition: always
  - name: "direct_call_outreach_writer"
    target: "outreach_writer_agent"
    description: "Run enrichment on a sourced list directly."
    condition: always

# ─────────────────────────────────────────────────────────────────────
# AGENTS
# ─────────────────────────────────────────────────────────────────────
agents:

  # ─────────────────────────────────────────────────────────────────────
  # sdr_coordinator — Campaign Operation Coordinator (AI). Owns each campaign
  # case: opens it, orchestrates the pod, keeps live status, is the growth
  # team's single point of contact. Pure orchestration — never sources a lead,
  # writes a sequence, or approves a send.
  # ─────────────────────────────────────────────────────────────────────
  sdr_coordinator_agent:
    name: sdr_coordinator_agent
    communication_type: chain
    agent_type: llm
    model: gpt-4o-mini
    temperature: 0.1
    description: "Campaign Coordinator — opens the case, orchestrates, keeps status, single point of contact."
    prompt: |
      You are the Campaign Operation Coordinator. You OWN each campaign case
      from the moment the growth team asks to run one until it is launched and
      its replies are worked. You orchestrate the pod and keep the team
      informed — you never source a lead, write a sequence, or approve a send.

      On a start request: open the case, echo gtm_id / offering_id from the
      input, and hand it to the campaign strategist to assemble.
      On a status ask: answer current stage / waiting-on / next gate from the
      case record — nothing invented. Route any exception to the Growth/RevOps
      Lead; never make a spend or brand call yourself.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"action": "", "campaign_id": "", "gtm_id": "", "offering_id": "", "stage": "", "waiting_on": "", "summary": ""}
    yields:
      action: "string"          # open_case | status | escalate
      campaign_id: "string"
      gtm_id: "string"
      offering_id: "string"
      stage: "string"
      waiting_on: "string"
      summary: "string"
    inputs:
      gtm_id: "string"
      offering_id: "string"
    can_call:
      - agent: campaign_strategist_agent
        condition: "calling_agent_response.action == 'open_case'"
      - agent: growth_lead_human
        condition: "calling_agent_response.action == 'escalate'"
      - agent: audit_logger_agent
        condition: "calling_agent_response.action == 'status'"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────
  # gtm_strategist — GTM head (AI, Super-Agent). Researches the onboarded
  # company and owns the go-to-market strategy over time. super_agent =
  # autonomous plan/execute/verify across many sources (a genuinely
  # multi-step research + maintenance job). Playbook = the craft, loaded on
  # demand. Tools pull research; the mcp (SERP) block ships COMMENTED.
  # ─────────────────────────────────────────────────────────────────────
  gtm_strategist_agent:
    name: gtm_strategist_agent
    agent_type: llm
    description: "GTM head — researches the company and owns the GTM doc; weekly appends ideas or spins a new GTM; promotes offering-worthy ideas."
    model: "claude-sonnet-4-6"
    temperature: 0.3
    max_completion_tokens: 4000
    max_tool_calls_per_message: 15   # deep research chain; default 5 truncates silently
    communication_type: "chain"
    # Weekly idea/event sweep in the company's timezone (NOT UTC). Also
    # reachable via the weekly_gtm_sweep entry point. Set your business zone.
    wake_up: "0 7 * * 1"             # Mon 07:00 local
    timezone: "America/New_York"
    super_agent:                     # DICT form = the tuning path (2.4.123+)
      cost_ceiling: 120000
      wall_clock: 900
    prompt: |
      You are the GTM head for the onboarded company. context["prepared_data"]
      carries the company record AND every existing GTM doc (pre_compose
      already pulled them) — reason over what already exists.

      RESEARCH the market thesis + ICP + a set of ideas (use your tools; go
      deep). MAINTAIN the GTM: decide per idea whether it APPENDS to an
      existing GTM (same strategy) or the strategy shifted enough to warrant a
      NEW GTM — set gtm_changed=true ONLY for a new/materially-changed
      strategy. PROMOTE ideas worth an offering with is_offering_candidate and
      list their ids in offering_candidate_ids (not every idea — only clear
      offering angles). idea_count = ideas this run; echo company_id. The
      append-vs-new WRITE happens in your post-processor — you decide, it persists.
      Load the `gtm_research` / `gtm_maintenance` playbook for the exact order.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"gtm_id": "", "gtm_changed": false, "has_offering_candidate": false, "offering_candidate_ids": [], "market_thesis": "", "idea_count": 0, "version": 0, "company_id": ""}
    enforce_yields: true
    enforce_yields_retry: 2
    # Playbook — the CRAFT, fetched on demand. Only `description` rides in the
    # prompt; `responsibility` is loaded when the model recognises the intent.
    playbook:
      - intent: gtm_research
        description: "How to research a company's market and build an ICP + ideas."
        responsibility: |
          1. Read the company record + every existing GTM FIRST — you cannot
             judge append-vs-new without knowing what strategy already exists.
          2. Build a market thesis: who buys, why now, what changed. Ground
             each idea in a specific market signal, not a generic template.
          3. Score each idea for a clear offering angle; only those become
             offering candidates.
        variables: [company_id]
      - intent: gtm_maintenance
        description: "How to decide append-to-existing vs spin a new GTM."
        responsibility: |
          1. If the ICP / thesis is the same, APPEND ideas to the matching GTM.
          2. Spin a NEW GTM only when the strategy itself shifted (new segment,
             new motion, new positioning) — set gtm_changed=true.
          3. A new/changed GTM must be reviewed by the Growth Lead before it
             drives offerings — never let it flow downstream unreviewed.
        variables: [company_id]
    # Day-0 tool surface — dev stand-ins that announce themselves. To wire real
    # research, uncomment the mcp block below (each named action becomes a tool);
    # here before the first start, in Studio's YAML editor after it.
    tools: ["web_research", "find_market_events"]
    # ── Real research via MCP (SERP / Surfer). Create the vault connection
    #    'serp_mcp' on Infrastructure → Integrations → MCP (the server's address +
    #    token — entered only in the vault, never as url:/token: here), then
    #    uncomment (here before the first start, in Studio's YAML editor after
    #    it — applies live, no restart). The dev tools above are the day-0 fallback. ──
    # mcp:
    #   - connection: serp_mcp
    #     transport: http
    #     use: [search, fetch_page]
    #     name: serp
    #     timeout: 30
    yields:
      gtm_id: "string"
      gtm_changed: "boolean"
      has_offering_candidate: "boolean"
      offering_candidate_ids: {type: array, items: string}
      market_thesis: "string"
      idea_count: "number"
      version: "number"
      company_id: "string"
    inputs:
      company_name: "string"
      website: "string"
      linkedin: "string"
    can_call:
      # New/changed strategy → human sign-off before it drives offerings
      - agent: "growth_lead_human"
        condition: "calling_agent_response.gtm_changed == true"
      # Flagged offering idea on a stable GTM → build the offering
      - agent: "offer_architect_agent"
        condition: "calling_agent_response.has_offering_candidate == true and calling_agent_response.gtm_changed == false"
      # Otherwise record the run
      - agent: "audit_logger_agent"
        condition: "calling_agent_response.has_offering_candidate == false and calling_agent_response.gtm_changed == false"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────
  # offer_architect — Offering & Messaging Architect (AI). Turns a strategy
  # idea into a sellable offering + A/B × persona × industry variants.
  # ─────────────────────────────────────────────────────────────────────
  offer_architect_agent:
    name: offer_architect_agent
    agent_type: "llm"
    description: "Offering builder — turns a GTM idea into a sellable offering with A/B × persona × industry variants."
    model: "claude-sonnet-4-6"
    temperature: 0.3
    max_completion_tokens: 4000
    communication_type: "chain"
    wake_up: "0 8 * * 1"             # Mon 08:00 local — build offerings for unbuilt ideas
    timezone: "America/New_York"
    prompt: |
      You turn a GTM idea into a sellable, message-ready OFFERING.
      context["prepared_data"] carries the flagged idea(s) + parent GTM
      (pre_compose pulled ideas that lack an offering).

      Build the offering (name, industry, pains, solution, outcomes,
      objections) then build VARIANTS — several per idea: A/B angle × persona
      × industry — so campaigns can draw from them. variant_count = variants
      produced. Echo idea_id and company_id. The WRITE happens in your
      post-processor (persist_offering). Load the `build_offering` playbook.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"offering_id": "", "idea_id": "", "name": "", "industry": "", "variant_count": 0, "ready_for_campaign": false, "company_id": ""}
    enforce_yields: true
    enforce_yields_retry: 2
    playbook:
      - intent: build_offering
        description: "How to turn an idea into an offering with drawable variants."
        responsibility: |
          1. Anchor the offering in the idea's pain — name the buyer's problem
             in their words, then the solution, the business outcome, the
             likely objection.
          2. Build variants across A/B angle × persona × industry; keep
             several in hand so campaigns pick, not improvise.
          3. Mark ready_for_campaign only when the offering has at least one
             complete variant per target persona.
        variables: [idea_id]
    yields:
      offering_id: "string"
      idea_id: "string"
      name: "string"
      industry: "string"
      variant_count: "number"
      ready_for_campaign: "boolean"
      company_id: "string"
    inputs:
      idea_id: "string"
    can_call:
      # Offerings do NOT auto-launch campaigns — record and stop.
      - agent: "audit_logger_agent"
        condition: always
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────
  # campaign_strategist — Campaign Conductor (AI). Assembles a campaign from a
  # GTM + offering. The human approval step (spend + brand) lives on its
  # outbound wire — requires_approval defaults TRUE, approved is read from the
  # human resume. Never sources or sends itself.
  # ─────────────────────────────────────────────────────────────────────
  campaign_strategist_agent:
    name: campaign_strategist_agent
    agent_type: "llm"
    description: "Campaign conductor — assembles a campaign from GTM + offering; a human approves spend/brand before it sources."
    model: "claude-sonnet-4-6"
    temperature: 0.3
    max_completion_tokens: 3000
    communication_type: "chain"
    prompt: |
      You assemble an outbound campaign. context["prepared_data"] carries the
      named GTM + offering + variants (pre_compose pulled them).

      Define the campaign: ICP filter, target size, sequence shape (how many
      email steps + LinkedIn), and which offering variants to use. Use
      assemble_campaign to lock the plan. requires_approval defaults TRUE — a
      human approves spend + brand before anything sends; set approved from the
      human's decision on a resume, false on first pass. Echo gtm_id,
      offering_id, company_id. Load the `assemble_campaign_plan` playbook.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"campaign_id": "", "gtm_id": "", "offering_id": "", "target_size": 0, "sequence_shape": "", "requires_approval": true, "approved": false, "company_id": ""}
    enforce_yields: true
    enforce_yields_retry: 2
    tools: ["assemble_campaign"]
    playbook:
      - intent: assemble_campaign_plan
        description: "How to turn a GTM + offering into a runnable campaign plan."
        responsibility: |
          1. Derive the ICP filter from the GTM's segment, not a guess — the
             list is only as good as the filter.
          2. Size the target to the offering's proven variants; a bigger list
             with weaker personalisation converts worse.
          3. Pin the sequence shape (email 1/2/3 + LinkedIn) so enrichment
             knows exactly how many steps to write per lead.
        variables: [gtm_id, offering_id]
    yields:
      campaign_id: "string"
      gtm_id: "string"
      offering_id: "string"
      target_size: "number"
      sequence_shape: "string"
      requires_approval: "boolean"
      approved: "boolean"
      company_id: "string"
    inputs:
      gtm_id: "string"
      offering_id: "string"
    can_call:
      # Default send gate — approve spend + brand before sourcing fires
      - agent: "sales_lead_human"
        condition: "calling_agent_response.requires_approval == true and calling_agent_response.approved == false"
      # Approved → source the leads
      - agent: "prospector_agent"
        condition: "calling_agent_response.approved == true"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────
  # prospector — Lead Sourcing (SYSTEM, programmatic). Pulls + validates the
  # target lead list. Day-0 it synthesises a small validated dev list into the
  # store so the chain runs with NO connector; when there is genuinely nothing
  # to source it announces available:false. Apollo ships as a COMMENTED
  # connector block. No leads → terminal record (never an unbounded re-source).
  # ─────────────────────────────────────────────────────────────────────
  prospector_agent:
    name: prospector_agent
    agent_type: "programmatic"
    description: "Lead sourcing — pulls + validates the target list (Apollo in prod; dev store day-0)."
    communication_type: "chain"
    # ── Real prospect data via Apollo MCP. Ships COMMENTED: create the vault
    #    connection 'apollo_mcp' (Infrastructure → Integrations → MCP), then uncomment
    #    (here before the first start, in Studio's YAML editor after it).
    #    The programmatic body's dev-store path is the day-0 fallback. ──
    # integration: "mcp"
    # connector_config:
    #   connection: apollo_mcp          # vault connection holds the address + token
    #   transport: "http"
    #   tool_name: "search_people"
    yields:
      list_id: "string"
      campaign_id: "string"
      lead_count: "number"
      leads: "list"
      validated: "boolean"
    inputs:
      campaign_id: "string"
      icp_filter: "object"
      target_size: "number"
    can_call:
      - agent: "outreach_writer_agent"
        condition: "calling_agent_response.lead_count > 0"
      # No leads → halt + log. The campaign owner re-runs start_campaign with a
      # wider ICP (a human decision) — NOT an automatic re-source loop.
      - agent: "audit_logger_agent"
        condition: "calling_agent_response.lead_count == 0"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────
  # outreach_writer — Sequence Writer (AI, FAN-OUT). Writes a hyper-
  # personalised multi-step sequence per lead. scaling.copies.count: 3 spins three
  # parallel copies; each calls claim_leads to grab a DISJOINT batch so the
  # copies don't duplicate work. The looping tools drive; the model writes one
  # step at a time. @chain re-checks completeness from the store (the model
  # cannot declare itself done early) and bounds a retry back-edge.
  # ─────────────────────────────────────────────────────────────────────
  outreach_writer_agent:
    name: outreach_writer_agent
    agent_type: "llm"
    description: "Sequence writer — hyper-personalised multi-step sequences per lead; parallel copies fan out over a claimed backlog."
    model: "claude-sonnet-4-6"
    temperature: 0.4
    max_completion_tokens: 2000
    max_tool_calls_per_message: 20   # long claim→write loop; the hard ceiling
    communication_type: "chain"
    scaling:                      # 2.4.484 (was instances / instances_handoff)
      copies:
        mode: fixed
        count: 3                     # 3 parallel copies per activation
        handoff: last          # combine, then route once
    prompt: |
      You write outbound sequences, one step at a time. The TOOLS drive; you write.

      FIRST call claim_leads to grab YOUR batch (each copy claims a DISJOINT
      batch — never write for a lead you did not claim); it returns the leads
      AND the step plan. For each claimed lead, write EVERY step in the plan —
      subject (email) + body — grounded in the lead's enrichment and coherent
      as a thread (escalating, not "way too different"); call write_sequence_step
      to persist each. When your batch is done, call claim_leads again; when it
      returns done=true the backlog is exhausted — call enrichment_status and
      report. THE JOB IS NOT FINISHED until every lead × every step is written.
      Hyper-personalise: cite something specific about the lead/company — no
      generic templates. Load the `write_sequence` playbook.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"campaign_id": "", "leads_enriched": 0, "sequences_written": 0, "all_sequences_complete": false, "enrichment_retry_exhausted": false}
    enforce_yields: true
    enforce_yields_retry: 1
    tools: ["claim_leads", "write_sequence_step", "enrichment_status"]
    playbook:
      - intent: write_sequence
        description: "How to write a hyper-personalised, escalating multi-step sequence."
        responsibility: |
          1. Ground every step in the lead's enrichment — a specific role,
             company event, or pain. A generic step is worse than no step.
          2. Keep the thread coherent: step 2 references step 1's angle, step 3
             raises the stakes; the LinkedIn touch is short and human.
          3. Never fabricate a fact about the lead you cannot cite. If you
             don't know, write to the role, not to an invented detail.
        variables: [campaign_id]
    yields:
      campaign_id: "string"
      leads_enriched: "number"
      sequences_written: "number"
      all_sequences_complete: "boolean"
      enrichment_retry_exhausted: "boolean"   # loop guard for the retry back-edge
    inputs:
      campaign_id: "string"
      list_id: "string"
    can_call:
      # Complete → hand to the launcher (the finisher).
      - agent: "campaign_launcher_agent"
        condition: "calling_agent_response.all_sequences_complete == true"
      # Incomplete + budget left → re-run the enrichment loop (BOUNDED back-edge).
      - agent: "outreach_writer_agent"
        condition: "calling_agent_response.all_sequences_complete == false and calling_agent_response.enrichment_retry_exhausted == false"
      # Incomplete + budget spent → escalate the stall to the accountable owner.
      - agent: "growth_lead_human"
        condition: "calling_agent_response.all_sequences_complete == false and calling_agent_response.enrichment_retry_exhausted == true"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────
  # campaign_launcher — the FINISHER / send actuator (programmatic). Sits
  # BEHIND the send gate: reaching it does NOT mean approved. It re-checks
  # approval (allow-token allowlist + block-token denylist; unknown fails
  # closed), enforces invariants a human can't waive (approved on record,
  # sequences complete, leads validated, not already launched), renders the
  # real launch pack to ./out, and DELETES it on a tripped floor. Dev-store
  # fallback announces itself (no sequencer → staged locally, real_send=false)
  # and NEVER fakes a send ack. See agency/campaign_launcher_agent.py.
  # ─────────────────────────────────────────────────────────────────────
  campaign_launcher_agent:
    name: campaign_launcher_agent
    agent_type: "programmatic"
    description: "Launcher (finisher) — re-checks approval, launches a complete campaign to the sequencer, renders the pack, fails closed."
    communication_type: "chain"
    # ── Real send via the sequencer (EmailBison / Instantly) MCP. Ships
    #    COMMENTED: create the vault connection 'sequencer_mcp' (Infrastructure
    #    → Integrations → MCP), then uncomment (here before the first start, in
    #    Studio's YAML editor after it). The launcher treats the sequencer as
    #    wired (real_send) as soon as that vault record exists. Until then the
    #    dev-store path stages locally and announces itself. ──
    # integration: "mcp"
    # connector_config:
    #   connection: sequencer_mcp          # vault connection holds the address + token
    #   transport: "http"
    #   tool_name: "upload_campaign"
    yields:
      campaign_id: "string"
      approved: "boolean"
      sequences_ready: "boolean"
      launched: "boolean"
      scheduled_count: "number"
      artifact_path: "string"
      status: "string"          # launched | blocked
      block_reasons: "array"
    inputs:
      campaign_id: "string"
    can_call:
      - agent: "records_keeper_agent"
        condition: "calling_agent_response.launched == true"
      # Blocked launch → escalate to the accountable owner.
      - agent: "growth_lead_human"
        condition: "calling_agent_response.status == 'blocked'"
      # Always record the outcome (launched OR blocked) in the WORM sink.
      - agent: "audit_logger_agent"
        condition: always
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────
  # inbox_monitor — Reply Puller (SYSTEM, programmatic, cron). Pulls new
  # replies from the mailbox / sequencer every 15 min. Day-0 there is no real
  # mailbox, so it announces available:false and returns nothing (never a
  # fabricated reply). Mailbox ships as a COMMENTED connector block.
  # ─────────────────────────────────────────────────────────────────────
  inbox_monitor_agent:
    name: inbox_monitor_agent
    agent_type: "programmatic"
    description: "Reply puller — pulls new replies from the mailbox/sequencer (dev day-0 announces no source)."
    communication_type: "chain"
    wake_up: "*/15 * * * *"          # every 15 min, local
    timezone: "America/New_York"
    wake_up_input:
      trigger: pull_replies
    # ── Real reply ingest via the mailbox MCP. Ships COMMENTED: create the
    #    vault connection 'mailbox_mcp' (Infrastructure → Integrations → MCP), then
    #    uncomment (here before the first start, in Studio's YAML editor after it). ──
    # integration: "mcp"
    # connector_config:
    #   connection: mailbox_mcp          # vault connection holds the address + token
    #   transport: "http"
    #   tool_name: "fetch_replies"
    yields:
      replies: "list"
      reply_count: "number"
    inputs:
      since: "string"
    can_call:
      - agent: "reply_triager_agent"
        condition: "calling_agent_response.reply_count > 0"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────
  # reply_triager — Reply Triage (AI). Classifies each reply and proposes an
  # action + draft. The routing floor is DETERMINISTIC (@chain): a
  # positive/objection/question/referral always reaches a human; an
  # unsub/OOO/hard-no auto-closes. The LLM can raise a flag, never lower one.
  # ─────────────────────────────────────────────────────────────────────
  reply_triager_agent:
    name: reply_triager_agent
    agent_type: "llm"
    description: "Reply triage — classifies each reply, proposes an action + draft; a deterministic floor routes it."
    model: "gpt-4o-mini"
    temperature: 0.2
    communication_type: "chain"
    prompt: |
      Classify this reply. context["prepared_data"] carries the original
      sequence + the lead's enrichment (pre_compose loaded the thread).

      classified_as ∈ [positive, objection, question, out_of_office,
      unsubscribe, referral, not_interested]. suggested_action ∈ [book, reply,
      suppress, nurture]. needs_human=true for positive/objection/question/
      referral; auto_closeable=true for unsubscribe/out_of_office/
      not_interested. draft_response: a suggested reply when needs_human. Echo
      reply_id, lead_id. Load the `triage_reply` playbook. (The routing floor
      re-derives needs_human / auto_closeable from classified_as — you cannot
      route a real conversation into the trash.)

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"reply_id": "", "lead_id": "", "classified_as": "", "suggested_action": "", "draft_response": "", "needs_human": false, "auto_closeable": false}
    enforce_yields: true
    enforce_yields_retry: 1
    playbook:
      - intent: triage_reply
        description: "How to classify a prospect reply and choose the next action."
        responsibility: |
          1. Read the reply against the thread — a "not now" after step 3 is a
             nurture, not a hard no.
          2. A referral names someone else; route it to a human, never
             auto-close it.
          3. When in doubt, prefer needs_human over auto_closeable — a missed
             positive is far costlier than a human glance.
        variables: [reply_id]
    yields:
      reply_id: "string"
      lead_id: "string"
      classified_as: "string"
      suggested_action: "string"
      draft_response: "string"
      needs_human: "boolean"
      auto_closeable: "boolean"
    inputs:
      reply_id: "string"
    can_call:
      - agent: "sdr_human"
        condition: "calling_agent_response.needs_human == true"
      - agent: "records_keeper_agent"
        condition: "calling_agent_response.auto_closeable == true"
      - agent: "audit_logger_agent"
        condition: "calling_agent_response.needs_human == false and calling_agent_response.auto_closeable == false"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────
  # meeting_scheduler — Meeting Booker (SYSTEM, programmatic). Books the
  # meeting when an SDR says 'book'. Calendar ships as a COMMENTED connector.
  # ─────────────────────────────────────────────────────────────────────
  meeting_scheduler_agent:
    name: meeting_scheduler_agent
    agent_type: "programmatic"
    description: "Meeting booker — books the meeting and confirms back (Google/Cal.com in prod)."
    communication_type: "chain"
    # ── Real booking via the calendar MCP. Ships COMMENTED: create the vault
    #    connection 'calendar_mcp' (Infrastructure → Integrations → MCP), then uncomment
    #    (here before the first start, in Studio's YAML editor after it). ──
    # integration: "mcp"
    # connector_config:
    #   connection: calendar_mcp          # vault connection holds the address + token
    #   transport: "http"
    #   tool_name: "book_meeting"
    yields:
      lead_id: "string"
      meeting_id: "string"
      slot: "string"
      booked_ok: "boolean"
    inputs:
      lead_id: "string"
    can_call:
      - agent: "records_keeper_agent"
        condition: "calling_agent_response.booked_ok == true"
      - agent: "audit_logger_agent"
        condition: "calling_agent_response.booked_ok == false"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────
  # records_keeper — CRM Sync (SYSTEM, programmatic). Writes campaign +
  # outcome state to the CRM. Salesforce/HubSpot ships as a COMMENTED connector.
  # ─────────────────────────────────────────────────────────────────────
  records_keeper_agent:
    name: records_keeper_agent
    agent_type: "programmatic"
    description: "CRM sync — writes campaign + outcome state to the CRM (Salesforce/HubSpot in prod)."
    communication_type: "chain"
    # ── Real CRM upsert via MCP. Ships COMMENTED: create the vault connection
    #    'crm_mcp' (Infrastructure → Integrations → MCP), then uncomment (here
    #    before the first start, in Studio's YAML editor after it). ──
    # integration: "mcp"
    # connector_config:
    #   connection: crm_mcp          # vault connection holds the address + token
    #   transport: "http"
    #   tool_name: "upsert_record"
    yields:
      crm_record_id: "string"
      synced_ok: "boolean"
    inputs:
      payload: "object"
    can_call:
      - agent: "audit_logger_agent"
        condition: always
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────
  # Human members — first-class, answering in Studio's Inbox. If nobody answers
  # within a seat's human_timeout_seconds, the request waits no longer: its
  # Inbox card closes and the ticket records that no reply came. Nothing is
  # sourced, sent or approved on silence, and nobody is chased automatically.
  # fallback_on_timeout / fallback_response are the declared intent
  # (held_for_review → audit); on SDK 2.4.486 a dual seat does not route them.
  # Every seat's can_call covers every reply: the words it asks for, and a
  # catch-all to audit for anything else. `dual` belongs on the human/webhook boundary agent ONLY (a dual→dual
  # wire is unbounded ping-pong the SDK warns on); every AI specialist is chain.
  # ─────────────────────────────────────────────────────────────────────

  growth_lead_human:
    name: growth_lead_human
    agent_type: "human"
    human_interface: "default"   # the Inbox (no vault connection needed)
    communication_type: "dual"
    human_timeout_seconds: 86400        # 24 h
    description: "Growth/RevOps Lead — accountable owner: approves a new/changed GTM, reviews stalls, launch blocks, and every escalation."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    yields:
      human_message: "string"           # approve | reject | held_for_review
    inputs:
      gtm_id: "string"
      market_thesis: "string"
    human_prompt_template: |
      Either a new or materially changed GTM strategy needs your sign-off, or
      the team needs you on a stalled or blocked campaign (details above).
      For a GTM, reply with exactly one word:
        approve  — the GTM may drive new offerings
        reject   — it does not; the decision is recorded
      For a stall or a blocked launch, reply with what you decided; it is
      recorded, and you re-run start_campaign when it is fixed.
    can_call:
      # GTM approved → build the offering. Only a GTM sign-off request leads
      # there: an "approve" on a stall or blocked launch is just recorded.
      - agent: "offer_architect_agent"
        condition: "calling_agent_response.human_message == 'approve' and calling_agent_response.from_agent == 'gtm_strategist_agent'"
      # Everything else (reject, held, a decision on a stall/block) → record it.
      - agent: "audit_logger_agent"
        condition: "calling_agent_response.human_message != 'approve' or calling_agent_response.from_agent != 'gtm_strategist_agent'"

  sales_lead_human:
    name: sales_lead_human
    agent_type: "human"
    human_interface: "default"   # the Inbox (no vault connection needed)
    communication_type: "dual"
    human_timeout_seconds: 86400        # 24 h
    description: "Sales Lead — approves a campaign before any lead is sourced or any email sent (spend + brand gate)."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    yields:
      human_message: "string"           # approve | reject | held_for_review
    inputs:
      campaign_id: "string"
      target_size: "number"
      sequence_shape: "string"
    human_prompt_template: |
      A campaign plan is waiting for your approval (target size, sequence and
      offering above). Reply with exactly one word:
        approve  — leads are sourced and sequences written; the launcher
                   re-checks your approval before anything is sent
        reject   — nothing is sourced or sent; the decision is recorded
    can_call:
      # Approved → source the leads. The prospector writes this approval onto
      # the campaign record; the launcher re-reads it before any send.
      - agent: "prospector_agent"
        condition: "calling_agent_response.human_message == 'approve'"
      # Anything else (reject, held) → record; nothing is sourced or sent.
      - agent: "audit_logger_agent"
        condition: "calling_agent_response.human_message != 'approve'"

  sdr_human:
    name: sdr_human
    agent_type: "human"
    human_interface: "default"   # the Inbox (no vault connection needed)
    communication_type: "dual"
    human_timeout_seconds: 14400        # 4h
    description: "SDR — works a flagged reply: book a meeting, log a reply sent from their mailbox, or hold."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    yields:
      human_message: "string"           # book | send_reply | hold | held_for_review
    inputs:
      reply_id: "string"
      lead_id: "string"
      draft_response: "string"
      classified_as: "string"
    human_prompt_template: |
      A prospect replied and it needs you (the reply, its classification and
      a suggested response are above). Reply with exactly one word:
        book        — book the meeting on the calendar
        send_reply  — you sent the reply from your mailbox; log it to the CRM
        hold        — do nothing now; the decision is recorded
    can_call:
      - agent: "meeting_scheduler_agent"
        condition: "calling_agent_response.human_message == 'book'"
      # This pod sends nothing on this branch: the SDR replies from their own
      # mailbox / sequencer and the outcome is written to the CRM.
      - agent: "records_keeper_agent"
        condition: "calling_agent_response.human_message == 'send_reply'"
      - agent: "audit_logger_agent"
        condition: "calling_agent_response.human_message != 'book' and calling_agent_response.human_message != 'send_reply'"

  # ─────────────────────────────────────────────────────────────────────
  # WORM audit sink — hash-chained, append-only, the terminus of every path.
  # Registered in main.py via sdk.intelligence("audit_logger_agent").
  # ─────────────────────────────────────────────────────────────────────
  audit_logger_agent:
    name: audit_logger_agent
    agent_type: "external"
    framework: "custom"
    communication_type: "chain"
    description: "WORM audit — hash-chains every GTM/offering/campaign/launch/reply/booking decision, AND every held gate. Terminus."
    connector_config:
      sink_type: "local_file"
      local_file_path: "./logs/audit.jsonl"
    yields:
      audit_event_id: "string"
      written_at_utc: "string"
      hash_chain_prev: "string"
      hash_chain_current: "string"
    inputs:
      session_id: "string"
      payload: "object"
    can_call: []
